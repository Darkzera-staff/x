name: Windows Cloud PC - AnyDesk (Fixed)

on:
  workflow_dispatch:

jobs:
  start-cloud-pc:
    name: Iniciar Windows Cloud PC
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Instalar e Configurar AnyDesk
        shell: powershell
        run: |
          Write-Host "Baixando e iniciando AnyDesk..." -ForegroundColor Green
          
          $anydeskPath = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile $anydeskPath

          # Iniciar AnyDesk
          Start-Process $anydeskPath -ArgumentList "--start" -NoNewWindow
          Start-Sleep -Seconds 10

          # Tentar pegar o ID várias vezes
          $ID = ""
          for ($i = 1; $i -le 8; $i++) {
              Start-Sleep -Seconds 5
              $ID = & $anydeskPath --get-id
              if ($ID -and $ID -ne "0" -and $ID -match "\d") {
                  break
              }
              Write-Host "Tentativa $i de pegar ID..." -ForegroundColor Yellow
          }

          if ($ID -and $ID -ne "0") {
              Write-Host "AnyDesk ID: $ID" -ForegroundColor Cyan
              $ID | Out-File -FilePath "$env:GITHUB_WORKSPACE\ANYDESK_ID.txt"
          } else {
              Write-Host "Falha ao obter ID após várias tentativas." -ForegroundColor Red
          }

          # Definir senha
          echo "joyzonetech" | & $anydeskPath --set-password _full_access
          Write-Host "Senha configurada: joyzonetech" -ForegroundColor Green

      - name: Monitoramento AnyDesk
        shell: powershell
        run: |
          Write-Host "Monitoramento iniciado (verifica a cada 3 minutos)..." -ForegroundColor Green
          
          $anydeskPath = "$env:TEMP\AnyDesk.exe"
          
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "AnyDesk não está rodando. Reiniciando..." -ForegroundColor Red
                  Start-Process $anydeskPath -ArgumentList "--start" -NoNewWindow
              }
              Start-Sleep -Seconds 180
          }
