name: Windows Cloud PC - AnyDesk (Self-Contained)

on:
  workflow_dispatch:  # Executa manualmente

jobs:
  start-cloud-pc:
    name: Iniciar Windows Cloud PC
    runs-on: windows-latest
    timeout-minutes: 10080  # 7 dias

    steps:
      - name: Configurar AnyDesk (Sem download externo)
        shell: powershell
        run: |
          Write-Host "Iniciando configuração do AnyDesk..." -ForegroundColor Green

          # Baixar AnyDesk direto da fonte oficial
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"

          # Iniciar AnyDesk
          Start-Process "$env:TEMP\AnyDesk.exe" -ArgumentList "--start"

          Start-Sleep -Seconds 8

          # Pegar ID
          $ID = & "$env:TEMP\AnyDesk.exe" --get-id
          Write-Host "AnyDesk ID: $ID" -ForegroundColor Cyan

          # Definir senha
          echo "joyzonetech" | & "$env:TEMP\AnyDesk.exe" --set-password _full_access
          Write-Host "Senha configurada: joyzonetech" -ForegroundColor Green

          # Salvar ID em arquivo (útil para ver no log)
          $ID | Out-File -FilePath "$env:GITHUB_WORKSPACE\ANYDESK_ID.txt"

      - name: Iniciar VMQuickConfig + Automação
        shell: powershell
        run: |
          $vmPath = "C:\Users\Public\Desktop\VMQuickConfig"
          
          if (Test-Path $vmPath) {
              Start-Process $vmPath -Wait -WindowStyle Maximized
              Start-Sleep -Seconds 4

              # Automação de cliques (mais confiável)
              Add-Type -AssemblyName System.Windows.Forms
              $wshell = New-Object -ComObject WScript.Shell

              $positions = @(
                  @{x=147; y=489; delay=2},
                  @{x=156; y=552; delay=2},
                  @{x=587; y=14;  delay=1},
                  @{x=916; y=17;  delay=1},
                  @{x=897; y=64;  delay=1}
              )

              foreach ($pos in $positions) {
                  [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($pos.x, $pos.y)
                  Start-Sleep -Seconds $pos.delay
              }
              Write-Host "Automação de cliques concluída." -ForegroundColor Green
          } else {
              Write-Host "VMQuickConfig não encontrado." -ForegroundColor Yellow
          }

      - name: Monitoramento AnyDesk (Manter vivo)
        shell: powershell
        run: |
          Write-Host "Iniciando monitoramento do AnyDesk..." -ForegroundColor Green
          
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "AnyDesk caiu. Reiniciando..." -ForegroundColor Red
                  Start-Process "$env:TEMP\AnyDesk.exe" -ArgumentList "--start"
              }
              Start-Sleep -Seconds 180  # Verifica a cada 3 minutos
          }

      - name: Manter Runner Vivo
        shell: powershell
        run: |
          Write-Host "Runner mantido ativo por até 7 dias..." -ForegroundColor Cyan
          Start-Sleep -Seconds 604800  # 7 dias
