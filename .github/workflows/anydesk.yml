name: Windows Cloud PC - Full Setup

on:
  workflow_dispatch:

jobs:
  setup:
    name: Configurar Windows Cloud PC
    runs-on: windows-latest
    timeout-minutes: 10080  # 7 dias

    steps:
      - name: Instalar Chocolatey + AnyDesk
        shell: powershell
        run: |
          Write-Host "Instalando Chocolatey e AnyDesk..." -ForegroundColor Green
          
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          choco install anydesk -y --ignore-checksums --force --no-progress
          Write-Host "AnyDesk instalado." -ForegroundColor Green

      - name: Baixar Arquivos e Programas
        shell: powershell
        run: |
          Write-Host "Baixando arquivos necessários..." -ForegroundColor Cyan

          # Seus arquivos do Dropbox
          Invoke-WebRequest 'https://www.dropbox.com/scl/fi/cypox1i3e2ewmpnr19fqn/start.bat?rlkey=s6skd47gmo21vkl0yv3tyneri&dl=1' -OutFile "start.bat"
          Invoke-WebRequest 'https://www.dropbox.com/scl/fi/ox42qglbf6fsnm9erf8cw/timelimit.py?rlkey=opyeqgum1k95kud81xlc7d66r&dl=0' -OutFile "time.py"
          Invoke-WebRequest 'https://www.dropbox.com/scl/fi/lmlcrz3v1sayw8p51ki1j/shutdown.bat?rlkey=ysjxivh5vz4scnhkqgv3yc4mm&dl=0' -OutFile "shutdown.bat"

          # VMQuickConfig
          Invoke-WebRequest 'https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe' -OutFile 'C:\Users\Public\Desktop\VMQuickConfig.exe'

          # Telegram e WinRAR
          Invoke-WebRequest 'https://telegram.org/dl/desktop/win64' -OutFile "$env:PUBLIC\Desktop\Telegram.exe"
          Invoke-WebRequest 'https://www.rarlab.com/rar/winrar-x64-621.exe' -OutFile "$env:PUBLIC\Desktop\Winrar.exe"

      - name: Instalar Programas
        shell: powershell
        run: |
          # Telegram
          Start-Process "$env:PUBLIC\Desktop\Telegram.exe" -ArgumentList '/VERYSILENT /NORESTART' -Wait
          Remove-Item "$env:PUBLIC\Desktop\Telegram.exe" -Force

          # WinRAR
          Start-Process "$env:PUBLIC\Desktop\Winrar.exe" -ArgumentList '/S' -Wait
          Remove-Item "$env:PUBLIC\Desktop\Winrar.exe" -Force

          Write-Host "Telegram e WinRAR instalados." -ForegroundColor Green

      - name: Configurações do Sistema
        shell: powershell
        run: |
          # Senha do usuário
          $password = "@#Joyzonetech123456"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText $password -Force)
          Write-Host "Senha configurada: $password" -ForegroundColor Green

          # Mostrar Computador na Área de Trabalho
          reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel" /v "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" /t REG_DWORD /d 0 /f

          # Fuso Horário
          tzutil /s "Pacific Standard Time"

      - name: Executar start.bat + VMQuickConfig + Monitoramento
        shell: powershell
        run: |
          # Executa seu start.bat
          if (Test-Path "start.bat") {
              cmd /c start.bat
              Write-Host "start.bat executado." -ForegroundColor Green
          }

          # Inicia VMQuickConfig
          $vmPath = "C:\Users\Public\Desktop\VMQuickConfig.exe"
          if (Test-Path $vmPath) {
              Start-Process $vmPath -WindowStyle Maximized
              Write-Host "VMQuickConfig iniciado." -ForegroundColor Green
          }

          # Monitoramento AnyDesk
          Write-Host "Iniciando monitoramento do AnyDesk..." -ForegroundColor Cyan
          while ($true) {
              $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $anydesk) {
                  Write-Host "AnyDesk caiu. Reiniciando..." -ForegroundColor Red
                  Start-Process "C:\Program Files (x86)\AnyDesk\AnyDesk.exe" --ArgumentList "--start"
              }
              Start-Sleep -Seconds 300
          }
